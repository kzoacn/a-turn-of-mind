[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/fonts/OFL.txt,THIRD_PARTY.md"
exclude_filter="tests/*,tools/*,docs/*,test-results/*,.tools/*,build/*"
export_path="build/windows/BorrowedMoves.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
application/modify_resources=false
application/product_name="Borrowed Moves"
application/file_description="Borrowed Moves - phase one prototype"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
codesign/enable=false

[preset.1]
name="Web"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter="data/*.json,assets/fonts/OFL.txt,THIRD_PARTY.md"
exclude_filter="tests/*,tools/*,docs/*,test-results/*,.tools/*,build/*"
export_path="build/web/index.html"

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

